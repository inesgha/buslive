# Déclare les packages du monorepo : chaque dossier de apps/ et packages/
# qui contient un package.json devient un « workspace ».
packages:
  - 'apps/*'
  - 'packages/*'

# Par sécurité, pnpm n'exécute pas les scripts d'installation (postinstall…)
# des dépendances sans accord explicite. On décide ici, paquet par paquet :
#   true  → autorisé (téléchargement d'un binaire natif nécessaire)
#   false → refusé volontairement
allowBuilds:
  # binaire natif utilisé par tsup
  esbuild: true
  # moteur de migrations de Prisma (schema engine)
  prisma: true
  '@prisma/engines': true
  # binaires précompilés déjà fournis via des dépendances optionnelles
  '@parcel/watcher': false
  unrs-resolver: false
  # Télémétrie embarquée par swagger-ui : inutile, et envoie des données à l'extérieur.
  '@scarf/scarf': false
  # Dépendances de firebase-admin : leurs scripts sont inutiles côté serveur
  # (configuration d'une app web Firebase, simple vérification de versions).
  '@firebase/util': false
  protobufjs: false
